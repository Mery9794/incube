<section class="hero-carousel full-width">

  <div class="carousel-container">

    <div
      *ngFor="let slide of slides; let i = index"
      class="carousel-slide"
      [class.active]="i === currentSlide">

      <div
        class="slide-bg"
        [ngStyle]="{
          'background-image': 'url(' + slide.fondo + ')'
        }">

        <div class="slide-content">

          <!-- IMAGEN -->
          <div class="slide-left">

            <img
              class="slide-books"
              [src]="slide.libros"
              [alt]="slide.titulo">

          </div>

          <!-- TEXTO Y BOTONES -->
          <div class="slide-right">

            <h1>{{ slide.titulo }}</h1>

            <p>{{ slide.descripcion }}</p>

            <div class="slide-actions">

              <button
                class="btn-coleccion"
                (click)="navegar(slide.ruta)">

                <i class="fa-solid fa-rocket"></i>
                Explorar colección

              </button>

              <button
                class="btn-comunidad"
                (click)="navegar('/comunidad')">

                <i class="fa-solid fa-users"></i>
                Conocé la comunidad

              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- FLECHAS -->
    <div class="carousel-controls">

      <button
        class="arrow-btn"
        (click)="anteriorSlide()"
        aria-label="Banner anterior">

        <i class="fa-solid fa-chevron-left"></i>

      </button>

      <button
        class="arrow-btn"
        (click)="siguienteSlide()"
        aria-label="Banner siguiente">

        <i class="fa-solid fa-chevron-right"></i>

      </button>

    </div>

    <!-- INDICADORES -->
    <div class="carousel-indicators">

      <button
        *ngFor="let slide of slides; let i = index"
        [class.active]="i === currentSlide"
        (click)="goToSlide(i)"
        [attr.aria-label]="'Ir al banner ' + (i + 1)"
        [attr.aria-current]="i === currentSlide ? 'true' : null">
      </button>

    </div>

  </div>

</section>
