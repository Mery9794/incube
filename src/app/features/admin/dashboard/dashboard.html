<div class="admin-layout">

    <aside class="sidebar">
        <a class="brand" routerLink="/" aria-label="Volver a inCUBë">
            <span class="brand-mark">I</span>
            <span class="brand-text">
                <strong>inCUBë</strong>
                <small>Administración</small>
            </span>
        </a>

        <div class="menu-heading">MENÚ PRINCIPAL</div>

        <nav class="side-menu" aria-label="Menú de administración">
            <button *ngFor="let item of menu" type="button" class="menu-item" [class.active]="seccionActiva === item.id"
                [attr.aria-current]="seccionActiva === item.id ? 'page' : null" (click)="seleccionarSeccion(item.id)">
                <span class="menu-icon" aria-hidden="true">{{ item.icono }}</span>
                <span>{{ item.nombre }}</span>
                <span class="active-mark" *ngIf="seccionActiva === item.id"></span>
            </button>
        </nav>

        <div class="sidebar-bottom">
            <div class="admin-avatar">A</div>
            <div class="admin-info">
                <strong>Administrador</strong>
                <small>Panel privado</small>
            </div>
            <span class="status-dot" title="Sesión aún no conectada"></span>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div class="breadcrumb">
                <span>inCUBë</span>
                <span class="breadcrumb-separator">/</span>
                <strong>{{ tituloSeccion }}</strong>
            </div>

            <a class="view-site" routerLink="/">
                <span aria-hidden="true">↗</span>
                Ver sitio web
            </a>
        </header>

        <div class="page-content">

            <!-- INICIO -->
            <app-inicio *ngIf="seccionActiva === 'inicio'" [colecciones]="colecciones" [recursos]="recursos"
                [totalImagenes]="totalImagenes" [cargandoCatalogo]="cargandoCatalogo" [mensajeCarga]="mensajeCarga"
                (cambiarSeccion)="seleccionarSeccion($event)" (sincronizar)="sincronizarCatalogo()">
            </app-inicio>

            <!-- COLECCIONES -->
            <app-colecciones *ngIf="seccionActiva === 'colecciones'" [colecciones]="colecciones" [recursos]="recursos"
                (volverInicio)="seleccionarSeccion('inicio')">
            </app-colecciones>

            <!-- LIBROS Y PROYECTOS -->
            <app-recursos *ngIf="seccionActiva === 'recursos'" [colecciones]="colecciones" [recursos]="recursos"
                [recursoEnEdicion]="recursoEnEdicion" [guardandoRecurso]="guardandoRecurso"
                [mensajeRecurso]="mensajeRecurso" (editar)="editarRecurso($event)"
                (cancelarEdicion)="cancelarEdicionRecurso()" (guardar)="guardarRecurso()"
                (volverInicio)="seleccionarSeccion('inicio')">
            </app-recursos>

            <!-- ARCHIVOS -->
            <app-archivos *ngIf="seccionActiva === 'archivos'" [colecciones]="colecciones" [recursos]="recursos"
                [totalImagenes]="totalImagenes" (volverInicio)="seleccionarSeccion('inicio')">
            </app-archivos>

            <!-- COLORES Y DISEÑO -->
            <app-diseno *ngIf="seccionActiva === 'diseno'">
            </app-diseno>

            <!-- CONFIGURACIÓN -->
            <app-configuracion *ngIf="seccionActiva === 'configuracion'">
            </app-configuracion>

            <footer class="page-footer">
                <span>inCUBë · Panel de administración</span>
                <span>Plataforma educativa</span>
            </footer>

        </div>
    </main>
</div>
