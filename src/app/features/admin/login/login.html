<div class="login-page">
  <section class="login-card">

    <div class="login-form-panel">
      <a class="brand" routerLink="/" aria-label="Volver al inicio de INCUBÉ">
        <img src="logos/logo-incube1.png" alt="INCUBÉ">
      </a>

      <div class="form-content">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Administración de INCUBÉ</p>

        <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

          <div class="field">
            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" name="correo" [(ngModel)]="correo" placeholder="Tu correo electrónico"
              autocomplete="username" required email>
          </div>

          <div class="field">
            <label for="contrasena">Contraseña</label>

            <div class="password-wrapper">
              <input id="contrasena" [type]="mostrarContrasena ? 'text' : 'password'" name="contrasena"
                [(ngModel)]="contrasena" placeholder="Tu contraseña" autocomplete="current-password" required>

              <button type="button" class="toggle-password" (click)="mostrarContrasena = !mostrarContrasena"
                [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                <svg *ngIf="!mostrarContrasena" xmlns="http://www.w3.org/2000/svg" width="21" height="21"
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>

                <svg *ngIf="mostrarContrasena" xmlns="http://www.w3.org/2000/svg" width="21" height="21"
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <path d="m3 3 18 18" />
                  <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                  <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.8" />
                  <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8" />
                </svg>
              </button>
            </div>
          </div>

          <p class="error-message" *ngIf="mensajeError" role="alert">
            {{ mensajeError }}
          </p>

          <button type="submit" class="login-button" [disabled]="loginForm.invalid">
            Iniciar sesión
          </button>
        </form>

        <p class="access-note">
          <span class="lock-icon" aria-hidden="true">●</span>
          Acceso exclusivo para administradores
        </p>
      </div>
    </div>

    <div class="login-image-panel">
      <div class="image-overlay"></div>

      <div class="image-caption">
        <span class="caption-label">INCUBÉ</span>
        <h2>Aprender, crear y descubrir.</h2>
        <p>Recursos educativos para explorar nuevas ideas.</p>
      </div>
    </div>

  </section>
</div>
